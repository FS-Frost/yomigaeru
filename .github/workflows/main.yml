name: Deploy to GitHub Pages

on:
    push:
        branches:
            - main

jobs:
    build-deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout 🛎️
              uses: actions/checkout@v5

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Install dependencies
              run: bun install

            - name: Svelte check
              run: bun run check

            - name: Build
              # BASE_PATH debe coincidir con el nombre del repo en GitHub Pages.
              run: BASE_PATH=/yomigaeru bun run build

            - name: Generate .nojekyll
              run: echo "" > build/.nojekyll

            - name: Deploy
              uses: JamesIves/github-pages-deploy-action@v4
              with:
                  branch: gh-pages
                  folder: build
